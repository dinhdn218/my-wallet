<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon. Cùng hình với components/layout/logo.tsx nhưng màu HARD-CODE:
    file tĩnh không đọc được biến CSS của app.

    Nền men xanh đặc chứ không trong suốt — tab trình duyệt có thể sáng hoặc
    tối, logo trong suốt sẽ mất hình ở một trong hai trường hợp. Viền men 2px
    quanh ô vàng cũng chính là mép tấm bảng.

    Chữ V là phần KHOÉT THỦNG khỏi ô vàng (fill-rule evenodd), không phải hình
    xanh vẽ chồng lên: hai hình chồng nhau sẽ hở viền khi khử răng cưa.
  -->
  <rect width="32" height="32" fill="#0f4c3a"/>
  <path fill="#edc948" fill-rule="evenodd"
        d="M2 2h28v28H2V2zm7 6h5l2 11 2-11h5l-4.5 16h-5L9 8z"/>
</svg>
